name: Build bl1-gec6818 (32-bit Raptor 2GB Unlock)

on:
  push:
    branches: [ "artik", "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 安装 32位 编译依赖 (Install Dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5 libtinfo5 gcc-arm-none-eabi

    - name: 植入 V10 终极真理加载器 (The Truth)
      run: |
        sed -i 's/OPMODE[[:space:]]*=[[:space:]]*aarch64/#OPMODE = aarch32/g' config.mak
        sed -i 's/#OPMODE[[:space:]]*=[[:space:]]*aarch32/OPMODE = aarch32/g' config.mak
        sed -i 's/arm-eabi-/arm-none-eabi-/g' config.mak Makefile
        sed -i 's/^[[:space:]]*fi[[:space:]]*$/# fi/g' Makefile
        sed -i 's/0x40000000/0x40000000/g' src/SecureManager.c || true
        sed -i 's/0x0F << 28/0x0F << 28 | 0x1E << 1/g' src/SecureManager.c || true
        echo "CFLAGS += -fcommon" >> config.mak

        cat << 'EOF' > rewrite_loader.py
        import re

        with open('src/iSDHCBOOT.c', 'r', encoding='utf-8') as f:
            content = f.read()

        match = re.search(r'static\s+CBOOL\s+SDMMCBOOT\(SDXCBOOTSTATUS', content)
        start_idx = match.start() if match else -1
        end_idx = content.find("void NX_SDPADSetALT(U32 PortNum)")

        custom_sdmmcboot = """static CBOOL SDMMCBOOT(SDXCBOOTSTATUS * pSDXCBootStatus, struct NX_SecondBootInfo * pTBI)
        {
            CBOOL result = CFALSE;
            U32 load_addr   = 0x7FD00000;
            U32 launch_addr = 0x7FD00800;
            U32 sector_count = 640;     
            
            printf("\\r\\n===== RP-KING LOADER v10 (The Truth) =====\\r\\n");
            printf("BootROM passed Port: %d\\r\\n", pSBI->DBI.SDMMCBI.PortNumber);
            
            // 核心真相：通道 0 才是 SD 卡！通道 2 是 eMMC！
            pSDXCBootStatus->SDPort = 0;
            
            if (CTRUE != NX_SDMMC_Open(pSDXCBootStatus)) {
                printf("SDMMC Open Failed on Port 0!\\r\\n");
                return CFALSE;
            }
            
            result = NX_SDMMC_ReadSectors(pSDXCBootStatus, 129, sector_count, (U32 *)load_addr);
            
            if (result == CTRUE) {
                printf("Read OK! Preparing to launch...\\r\\n");
                
                // 告诉接下来的 fip-loader：我们是从 SD 卡（通道 0）启动的！
                pSBI->DBI.SDMMCBI.PortNumber = 0;
                
                NX_SDMMC_Close(pSDXCBootStatus);
                NX_SDMMC_Terminate(pSDXCBootStatus);
                
                printf("Jumping to 0x%08X (R0=pSBI)...\\r\\n", launch_addr);
                
                // 完美的 ARM 标准跳转，把 pSBI 交到 R0 寄存器
                void (*fip_jump)(U32, U32, U32) = (void (*)(U32, U32, U32))launch_addr;
                fip_jump((U32)pSBI, 0, 0);
                
                printf("\\r\\n[!] ZOMBIE RETURN DETECTED!\\r\\n");
                while(1);
            }
            
            return result;
        }

        """
        
        content = content[:start_idx] + custom_sdmmcboot + content[end_idx:]

        # 删除原版的通道指派，防止干扰我们函数内锁死的 Port 0
        content = content.replace('pSDXCBootStatus->SDPort = pSBI->DBI.SDMMCBI.PortNumber;', '')

        with open('src/iSDHCBOOT.c', 'w', encoding='utf-8') as f:
            f.write(content)
        EOF
        
        python3 rewrite_loader.py
    - name: 执行编译生成 32位 裸二进制文件 (Make BL1)
      run: |
        make

    - name: 注入 2GB 内存参数合成 NSIH (Inject 2GB RAM & Merge)
      run: |
        cat << 'EOF' > build_nsih.py
        import sys, struct

        def main():
            txt_path = sys.argv[1]
            bin_path = sys.argv[2]
            out_path = sys.argv[3]
            
            header = bytearray(512)
            idx = 0
            
            with open(txt_path, 'r') as f:
                for line in f:
                    line = line.strip()
                    if not line or line.startswith(('//', '#')): continue
                    try:
                        val = int(line.split()[0], 16)
                        if idx < 128:
                            struct.pack_into('<I', header, idx * 4, val)
                            idx += 1
                    except ValueError:
                        pass
            
            # 荣品专属硬核覆盖区 (包含通道、偏移和 2GB 物理时序)
            ddr_2g_params = {
                0x040: 0x00000400, # 指向紧贴头部的第 2 扇区
                0x050: 0x00000002, # 荣品 SD 卡通道 2
                0x098: 0x03100302, 0x09C: 0x004007C0, 0x0A0: 0x06000B08,
                0x0A4: 0x0C0C0C0C, 0x0A8: 0x04040404, 0x0AC: 0x0000401B,
                0x0B0: 0x00620618, 0x0B4: 0x6836650E, 0x0B8: 0x3630580B,
                0x0BC: 0x41000A26, 0x0C0: 0x00020102, 0x0C4: 0x06060606,
                0x0C8: 0x06060606, 0x0CC: 0x00000104, 0x0D0: 0x00000004
            }
            for offset, val in ddr_2g_params.items():
                struct.pack_into('<I', header, offset, val)
            
            with open(bin_path, 'rb') as f:
                bin_data = f.read()
                
            with open(out_path, 'wb') as f:
                f.write(header)
                f.write(bin_data)
                
            print(f"成功生成完美 2GB 解锁版固件！BL1 大小: {len(bin_data)} bytes.")

        if __name__ == '__main__':
            main()
        EOF

        RAW_BIN=$(ls out/*.bin | head -n 1)
        echo "找到编译输出的裸固件: $RAW_BIN"
        
        # 注意：使用 32 位的 txt 作为底稿！
        python3 build_nsih.py "reference-nsih/drone-sd-32.txt" "$RAW_BIN" "out/bl1-mmcboot.bin"

    - name: 上传最终编译产物 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: bl1-gec6818-binaries
        path: out/
