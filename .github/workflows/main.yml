name: Build bl1-gec6818 (32-bit Raptor 2GB Unlock)

on:
  push:
    branches: [ "artik", "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 安装 32位 编译依赖 (Install Dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5 libtinfo5 gcc-arm-none-eabi

    - name: 修复配置文件并植入 DEBUG 探针 (Patch config & Add Debug Probe)
      run: |
        # 1. 强制回归 32 位模式并修复编译环境
        sed -i 's/OPMODE[[:space:]]*=[[:space:]]*aarch64/#OPMODE = aarch32/g' config.mak
        sed -i 's/#OPMODE[[:space:]]*=[[:space:]]*aarch32/OPMODE = aarch32/g' config.mak
        sed -i 's/arm-eabi-/arm-none-eabi-/g' config.mak Makefile
        sed -i 's/^[[:space:]]*fi[[:space:]]*$/# fi/g' Makefile
        sed -i 's/0x40000000/0x40000000/g' src/SecureManager.c || true
        sed -i 's/0x0F << 28/0x0F << 28 | 0x1E << 1/g' src/SecureManager.c || true
        echo "CFLAGS += -fcommon" >> config.mak

        # 2. 核心探测：用 Python 植入 printf 探针
        cat << 'EOF' > patch_c_code.py
        import os

        target_file = 'src/iSDHCBOOT.c'
        with open(target_file, 'r', encoding='utf-8') as f:
            lines = f.readlines()

        new_lines = []
        for line in lines:
            # 切除 AES 解密触发器
            if 'pReg_ClkPwr->SYSRSTCONFIG & 1<<14' in line:
                line = line.replace('pReg_ClkPwr->SYSRSTCONFIG & 1<<14', '0')
            
            # 强行指定 129 扇区地址
            if 'pSDXCBootStatus = &lSDXCBootStatus;' in line:
                new_lines.append(line)
                new_lines.append('\t\tpSBI->DEVICEADDR = 66048;\n')
                continue

            # 探针 1：在去 SD 卡读数据前，打印打算读取的扇区号
            if 'result = NX_SDMMC_ReadSectors(pSDXCBootStatus,' in line:
                new_lines.append('\t\tprintf("\\r\\n===== BL1 DEBUG LOG =====\\r\\n");\n')
                new_lines.append('\t\tprintf("Target DEVICEADDR: %d (0x%X)\\r\\n", pSBI->DEVICEADDR, pSBI->DEVICEADDR);\n')
                new_lines.append('\t\tprintf("Target Sector: %d\\r\\n", pSBI->DEVICEADDR / 512);\n')
                new_lines.append(line)
                continue
                
            # 探针 2：在报错前，打印读出数据的 [第1个字节] 和 [签名区]
            if 'if (pTBI->SIGNATURE != HEADER_ID )' in line:
                new_lines.append('\t\tprintf("Read Sector First 4 Bytes: 0x%08X\\r\\n", ((U32 *)pTBI)[0]);\n')
                new_lines.append('\t\tprintf("Read Sector SIGNATURE  : 0x%08X\\r\\n", pTBI->SIGNATURE);\n')
                new_lines.append('\t\tprintf("=========================\\r\\n");\n')
                new_lines.append(line)
                continue

            new_lines.append(line)

        with open(target_file, 'w', encoding='utf-8') as f:
            f.writelines(new_lines)
            
        print("DEBUG 探针植入完毕！")
        EOF
        
        python3 patch_c_code.py

    - name: 执行编译生成 32位 裸二进制文件 (Make BL1)
      run: |
        make

    - name: 注入 2GB 内存参数合成 NSIH (Inject 2GB RAM & Merge)
      run: |
        cat << 'EOF' > build_nsih.py
        import sys, struct

        def main():
            txt_path = sys.argv[1]
            bin_path = sys.argv[2]
            out_path = sys.argv[3]
            
            header = bytearray(512)
            idx = 0
            
            with open(txt_path, 'r') as f:
                for line in f:
                    line = line.strip()
                    if not line or line.startswith(('//', '#')): continue
                    try:
                        val = int(line.split()[0], 16)
                        if idx < 128:
                            struct.pack_into('<I', header, idx * 4, val)
                            idx += 1
                    except ValueError:
                        pass
            
            # 荣品专属硬核覆盖区 (包含通道、偏移和 2GB 物理时序)
            ddr_2g_params = {
                0x040: 0x00000400, # 指向紧贴头部的第 2 扇区
                0x050: 0x00000002, # 荣品 SD 卡通道 2
                0x098: 0x03100302, 0x09C: 0x004007C0, 0x0A0: 0x06000B08,
                0x0A4: 0x0C0C0C0C, 0x0A8: 0x04040404, 0x0AC: 0x0000401B,
                0x0B0: 0x00620618, 0x0B4: 0x6836650E, 0x0B8: 0x3630580B,
                0x0BC: 0x41000A26, 0x0C0: 0x00020102, 0x0C4: 0x06060606,
                0x0C8: 0x06060606, 0x0CC: 0x00000104, 0x0D0: 0x00000004
            }
            for offset, val in ddr_2g_params.items():
                struct.pack_into('<I', header, offset, val)
            
            with open(bin_path, 'rb') as f:
                bin_data = f.read()
                
            with open(out_path, 'wb') as f:
                f.write(header)
                f.write(bin_data)
                
            print(f"成功生成完美 2GB 解锁版固件！BL1 大小: {len(bin_data)} bytes.")

        if __name__ == '__main__':
            main()
        EOF

        RAW_BIN=$(ls out/*.bin | head -n 1)
        echo "找到编译输出的裸固件: $RAW_BIN"
        
        # 注意：使用 32 位的 txt 作为底稿！
        python3 build_nsih.py "reference-nsih/drone-sd-32.txt" "$RAW_BIN" "out/bl1-mmcboot.bin"

    - name: 上传最终编译产物 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: bl1-gec6818-binaries
        path: out/
