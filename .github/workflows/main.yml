- name: 生成带 NSIH 头的最终固件 (Generate NSIH & Merge)
      run: |
        # 1. 编译头部生成工具
        cd nsih-generator
        if [ -f "Makefile" ]; then
          make
        else
          gcc -o nsih_generator *.c
        fi
        TOOL_NAME=$(find . -maxdepth 1 -type f -executable ! -name "*.sh" ! -name "*.c" | grep -v "\.o$" | head -n 1)
        TOOL_NAME=$(basename "$TOOL_NAME")
        cd ..

        # 2. 精准指定 NSIH 配置文件
        NSIH_TXT="reference-nsih/drone-sd-64.txt"
        echo "使用指定的 NSIH 配置文件: $NSIH_TXT"

        # 3. 使用工具合成最终固件
        # 假设工具用法是： ./工具名 配置文件 输入代码.bin 输出合并.bin
        ./nsih-generator/$TOOL_NAME "$NSIH_TXT" out/bl1-drone.bin out/bl1-mmcboot-sd.bin
        
        # 4. 备用防呆方案 (如果工具不直接支持合并，则先生成头，再用 cat 拼接)
        if [ ! -f "out/bl1-mmcboot-sd.bin" ]; then
          echo "工具可能不支持直接合并，尝试先生成 nsih.bin 然后手动拼接..."
          ./nsih-generator/$TOOL_NAME "$NSIH_TXT" out/nsih.bin
          if [ -f "out/nsih.bin" ]; then
            cat out/nsih.bin out/bl1-drone.bin > out/bl1-mmcboot-sd.bin
          else
            echo "错误: 无法生成 nsih.bin 头部文件！"
          fi
        fi
