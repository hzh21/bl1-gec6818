name: Build bl1-gec6818

on:
  push:
    branches: [ "artik", "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 安装老版本编译依赖 (Install Legacy Dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5 libtinfo5

    - name: 下载并解压交叉编译工具链 (Download Toolchain)
      run: |
        wget https://releases.linaro.org/archive/14.04/components/toolchain/binaries/gcc-linaro-aarch64-none-elf-4.8-2014.04_linux.tar.bz2
        tar xvjf gcc-linaro-aarch64-none-elf-4.8-2014.04_linux.tar.bz2

    - name: 修复配置文件和 Makefile (Patch config & Makefile)
      run: |
        sed -i 's/aarch64-elf-/aarch64-none-elf-/g' config.mak
        sed -i 's/^[[:space:]]*fi[[:space:]]*$/# fi/g' Makefile

    - name: 执行编译生成裸二进制文件 (Make BL1)
      run: |
        export PATH="$GITHUB_WORKSPACE/gcc-linaro-aarch64-none-elf-4.8-2014.04_linux/bin:$PATH"
        make

    - name: 使用 Python 自动合成 NSIH 头部 (Merge NSIH via Python)
      run: |
        # 创建一个 Python 脚本来解析 txt 并合并二进制
        cat << 'EOF' > build_nsih.py
        import sys, struct

        def main():
            txt_path = sys.argv[1]
            bin_path = sys.argv[2]
            out_path = sys.argv[3]
            
            # 初始化 512 字节的头部，全填 0
            header = bytearray(512)
            idx = 0
            
            # 解析 txt 文件中的 16 进制数据
            with open(txt_path, 'r') as f:
                for line in f:
                    line = line.strip()
                    # 忽略空行和注释
                    if not line or line.startswith(('//', '#')): 
                        continue
                    
                    # 提取每行的第一个有效十六进制字符串
                    token = line.split()[0]
                    try:
                        val = int(token, 16)
                        if idx < 128:
                            # 按照小端序 (Little-Endian) 写入 32 位无符号整数
                            struct.pack_into('<I', header, idx * 4, val)
                            idx += 1
                    except ValueError:
                        pass
            
            # 读取刚才编译出的 bl1-drone.bin
            with open(bin_path, 'rb') as f:
                bin_data = f.read()
                
            # 拼接并保存最终固件
            with open(out_path, 'wb') as f:
                f.write(header)
                f.write(bin_data)
                
            print(f"成功生成完美固件！NSIH 头部大小: {idx*4} bytes, BL1 载荷大小: {len(bin_data)} bytes.")

        if __name__ == '__main__':
            main()
        EOF

        # 运行刚才生成的 Python 脚本，指定 SD 卡 64 位配置
        python3 build_nsih.py "reference-nsih/drone-sd-64.txt" "out/bl1-drone.bin" "out/bl1-mmcboot-sd.bin"

    - name: 上传最终编译产物 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: bl1-gec6818-binaries
        path: out/
